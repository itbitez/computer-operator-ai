# Reverse proxy to the Next.js web service. Security headers ship from the
# app itself (src/proxy.ts + next.config.ts), not from nginx — this server
# block only terminates the connection and forwards traffic.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HMR websocket: dev hot reload rides on the upgrade connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Dev route compilation can exceed the default 60s on first request.
        proxy_read_timeout 300s;
    }
}
